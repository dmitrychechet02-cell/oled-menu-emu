name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Toolchain (clang, lld, clang-format)
        run: sudo apt-get update && sudo apt-get install -y clang lld clang-format

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Инструкции агентов синхронизированы
        run: npm run check:agents

      - name: Линтеры
        run: npm run lint

      - name: Unit-тесты
        run: make test

      - name: E2E-тесты
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
